<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>DrugDealerX OS</title>
</head>
<body>
    <div class="ipad-container">
        <!-- Bezel and Camera -->
        <div class="ipad-bezel">
            <div class="camera-dot"></div>
        </div>

        <div class="ipad-screen">
            <!-- Top Status Bar -->
            <div class="status-bar">
                <div class="left">
                    <span id="current-time">09:41</span>
                </div>
                <div class="right">
                    <span class="signal">📶</span>
                    <span class="wifi">℥</span>
                    <div class="battery">
                        <div class="battery-level"></div>
                    </div>
                </div>
            </div>

            <!-- Side Dock Navigation -->
            <div class="side-dock">
                <div class="dock-item active" data-tab="home" title="Dashboard">
                    <div class="icon-circle home-gradient">🏠</div>
                </div>
                <div class="dock-item" data-tab="market" title="Leaderboard">
                    <div class="icon-circle market-gradient">📈</div>
                </div>
                <div class="dock-spacer"></div>
                <div class="dock-item logout" onclick="closeUI()">
                    <div class="icon-circle logout-gradient">✕</div>
                </div>
            </div>

            <!-- Main Dynamic Content -->
            <div class="main-canvas">
                
                <!-- HOME TAB -->
                <section id="home" class="app-page active">
                    <header class="page-header">
                        <div class="header-text">
                            <p class="greeting">Welcome back, Operator</p>
                            <h1>Network Dashboard</h1>
                        </div>
                        <div class="connection-pill">
                            <div class="pulse"></div>
                            ENCRYPTED
                        </div>
                    </header>

                    <div class="grid-layout">
                        <!-- Large Feature Card -->
                        <div class="glass-card main-stats">
                            <div class="card-title">Net Revenue</div>
                            <div class="value-display">
                                <span class="currency">$</span>
                                <span id="money-value">0</span>
                            </div>
                            <div class="visualizer">
                                <div class="wave"></div>
                                <div class="wave"></div>
                            </div>
                        </div>

                        <!-- Mini Stats -->
                        <div class="mini-grid">
                            <div class="glass-card mini">
                                <div class="mini-label">Reputation</div>
                                <div class="mini-value" id="rep-value">0</div>
                                <div class="progress-track"><div class="progress-fill" id="rep-fill" style="width: 45%"></div></div>
                            </div>
                            <div class="glass-card mini">
                                <div class="mini-label">Units Distributed</div>
                                <div class="mini-value" id="sold-value">0</div>
                                <div class="progress-track"><div class="progress-fill" id="sold-fill" style="width: 60%"></div></div>
                            </div>
                        </div>

                        <!-- System Status -->
                        <div class="glass-card system-logs">
                            <div class="card-title">System Integrity</div>
                            <div class="log-entry">
                                <span class="log-time">SECURE</span>
                                <span class="log-msg">Proxy Tunnel Active</span>
                            </div>
                            <div class="log-entry">
                                <span class="log-time">ACTIVE</span>
                                <span class="log-msg">Market Listener v4.2</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- LEADERBOARD TAB -->
                <section id="market" class="app-page">
                    <header class="page-header">
                        <div class="header-text">
                            <p class="greeting">Global Rankings</p>
                            <h1>Shadow Market</h1>
                        </div>
                    </header>

                    <div class="leaderboard-container glass-card">
                        <div class="list-header">
                            <span>RANK</span>
                            <span>IDENTIFIER</span>
                            <span class="align-right">TOTAL REVENUE</span>
                        </div>
                        <div class="scroll-list" id="leaderboard-list">
                            <!-- Dynamic Content -->
                        </div>
                    </div>
                </section>

            </div>

            <!-- Home Indicator -->
            <div class="home-indicator"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
